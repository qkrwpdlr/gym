<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관절 SVG · 운동 시범 연구</title>
  <style>
    :root { color-scheme:dark; --ink:#ece8df; --paper:#151515; }
    * { box-sizing:border-box } body { margin:0; background:#0b0b0b; color:var(--ink); font:14px/1.5 system-ui,sans-serif }
    main { max-width:850px; margin:auto; padding:20px 12px } h1 { font-size:24px; margin:0 0 4px } p { color:#a9a69f; margin:0 0 16px }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px } article { border:1px solid #2b2b2b; border-radius:12px; background:var(--paper); overflow:hidden }
    h2 { margin:12px 16px 0; font-size:15px } svg { display:block; width:100%; height:260px; color:var(--ink) }
    .controls { display:flex; align-items:center; gap:12px; margin:14px 0; flex-wrap:wrap } button { min-height:44px; padding:0 16px; border:1px solid #444; border-radius:8px; background:#191919; color:inherit; font:inherit }
    input { flex:1; accent-color:#00ff88; min-width:140px } output { font-variant-numeric:tabular-nums; color:#00ff88 }
    @media(max-width:540px) { .grid { grid-template-columns:1fr } svg { height:240px } }
  </style>
</head>
<body><main>
  <h1>관절 SVG · 동작 연구</h1>
  <p>고정된 관절 길이와 기구 접점 · 연속 재생 / 직접 탐색</p>
  <div class="controls"><button id="play" aria-label="일시정지">일시정지</button><button id="slow" aria-pressed="false">½ 속도</button><input id="seek" type="range" min="0" max="6" step="0.01" value="0" aria-label="동작 시간"><output id="time">0.00초</output></div>
  <div class="grid">
    <article><h2>로우바 스쿼트</h2><svg id="squat" viewBox="42 8 126 134" role="img" aria-label="스쿼트 관절 애니메이션"></svg></article>
    <article><h2>루마니안 데드리프트</h2><svg id="hinge" viewBox="42 8 126 134" role="img" aria-label="RDL 관절 애니메이션"></svg></article>
    <article><h2>벤치프레스</h2><svg id="bench" viewBox="42 8 126 134" role="img" aria-label="벤치프레스 관절 애니메이션"></svg></article>
    <article><h2>한 발 브릿지</h2><svg id="floor" viewBox="42 8 126 134" role="img" aria-label="한 발 브릿지 관절 애니메이션"></svg></article>
  </div>
</main>
<script src="articulated-figure.js"></script>
<script>
(() => {
  const NS='http://www.w3.org/2000/svg', radians=Math.PI/180
  const go=(a,l,d)=>[a[0]+l*Math.sin(d*radians),a[1]+l*Math.cos(d*radians)]
  const mix=(a,b,u)=>a.map((v,i)=>v+(b[i]-v)*u)
  function ik(a,b,l1,l2,bend=1,axis=0) { const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.min(Math.hypot(dx,dy),l1+l2-.001),t=Math.atan2(dy,dx),v=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));const c=[t-v,t+v].map(q=>[a[0]+l1*Math.cos(q),a[1]+l1*Math.sin(q)]);return (c[0][axis]-c[1][axis])*bend>=0?c[0]:c[1] }
  function stand(shin,flex,trunk) {const ankleN=[104,128],kneeN=go(ankleN,24,180-shin),hip=go(kneeN,26,180-shin+flex),shoulder=go(hip,29,trunk);return {ankleN,kneeN,hip,shoulder}}
  const arms=(j,h,b=1)=>({...j,handN:h,elbowN:ik(j.shoulder,h,15,14,b)})
  const complete=j=>{for(const k of ['knee','ankle','elbow','hand'])j[k+'F']=j[k+'F']||[j[k+'N'][0]-2.6,j[k+'N'][1]-.7]; j.hipF=j.hip;j.shoulderF=[j.shoulder[0]-2.6,j.shoulder[1]-.7];return j}
  const solve={
    squat(u){ const j=stand(4+26*u,8+108*u,172-27*u);return arms(j,[j.shoulder[0]-5,j.shoulder[1]+4],-1) },
    hinge(u){const j=stand(4-7*u,8+16*u,178-75*u);return arms(j,[j.shoulder[0]+2,j.shoulder[1]+28])},
    bench(u){const hip=[99,89],shoulder=[71,91],ankleN=[124,128];return arms({hip,shoulder,ankleN,kneeN:ik(hip,ankleN,26,24),head:[61,91],torsoMid:[85,86]},mix([78,63],[89,83],u))},
    floor(u){const shoulder=[60,123],hip=mix([89,123],[87,108],u),ankleN=[124,128];return {shoulder,hip,ankleN,kneeN:ik(hip,ankleN,26,24,-1,1),head:[50,123],elbowN:[74.6,126],handN:[88.6,126],kneeF:go(hip,26,105),ankleF:go(go(hip,26,105),24,160),toeF:-40}}
  }
  function path(svg,d,w=1.3) {const p=document.createElementNS(NS,'path');for(const [k,v]of Object.entries({d,fill:'none',stroke:'#aaa79e','stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round'}))p.setAttribute(k,v);svg.appendChild(p);return p}
  const rigs={}
  for(const kind of Object.keys(solve)){const svg=document.getElementById(kind);path(svg,'M44 130.6 L165 130.6',.6);if(kind==='bench')path(svg,'M55 98 L110 98 M62 100 L62 130 M105 101 L105 130',2.4);const root=document.createElementNS(NS,'g');svg.appendChild(root);const rig=ArticulatedFigure.create(root);const equipment=path(svg,'',1.8);rigs[kind]={rig,equipment}}
  function render(t){const x=(t%6)/6,u=(1-Math.cos(x*Math.PI*2))/2;for(const kind in rigs){const j=complete(solve[kind](u));rigs[kind].rig.draw(j);if(kind!=='floor'){const h=kind==='squat'?[j.shoulder[0]-4,j.shoulder[1]+3]:j.handN,r=kind==='hinge'?12:9;rigs[kind].equipment.setAttribute('d',`M${h[0]-7} ${h[1]} h14 M${h[0]+4} ${h[1]-r} v${r*2} M${h[0]+7} ${h[1]-r+2} v${r*2-4}`)}}document.getElementById('seek').value=t%6;document.getElementById('time').textContent=t.toFixed(2)+'초'}
  let t=0,playing=!matchMedia('(prefers-reduced-motion:reduce)').matches,speed=1,prev=performance.now();const q=new URLSearchParams(location.search);if(q.has('t')){t=Number(q.get('t'));playing=false}const play=document.getElementById('play');const mark=()=>{play.textContent=playing?'일시정지':'재생';play.setAttribute('aria-label',play.textContent)};mark();render(t)
  document.getElementById('play').onclick=()=>{playing=!playing;mark()};document.getElementById('slow').onclick=e=>{speed=speed===1?.5:1;e.target.setAttribute('aria-pressed',String(speed!==1))};document.getElementById('seek').oninput=e=>{playing=false;t=Number(e.target.value);mark();render(t)}
  window.motionStudy={seek(value){t=value;playing=false;mark();render(t)},get time(){return t},get playing(){return playing}}
  function tick(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;if(playing&&!document.hidden){t=(t+dt*speed)%6;render(t)}requestAnimationFrame(tick)}requestAnimationFrame(tick)
})()
</script></body></html>
