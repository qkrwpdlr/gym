<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYM">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>GYM · 5 DAY SPLIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --bg-card: #141414;
    --bg-elevated: #1c1c1c;
    --accent: #ff2d2d;
    --accent-dim: #8a1818;
    --yellow: #ffdd00;
    --green: #00ff88;
    --text: #f5f5f5;
    --text-dim: #888;
    --text-faint: #444;
    --border: #2a2a2a;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  body {
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }

  /* ==================== LAYOUT ==================== */
  .app {
    background-image:
      radial-gradient(circle at 20% 0%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(255, 221, 0, 0.04) 0%, transparent 50%);
    background-attachment: fixed;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    max-width: 560px;
    margin: 0 auto;
  }

  /* ==================== STATUS CHIPS ==================== */
  .status-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .status-chip.active { border-color: var(--green); color: var(--green); }

  .status-chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-faint);
  }

  .status-chip.active .dot {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }

  /* ==================== HEADER ==================== */
  .header {
    padding: 8px 4px 20px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 18px;
    position: relative;
  }

  .header::before {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 60px;
    height: 2px;
    background: var(--accent);
    transition: background 0.3s;
  }

  .header-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.2em;
    margin-bottom: 8px;
    font-weight: 700;
    transition: color 0.3s;
  }

  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    line-height: 0.9;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  .header-title span {
    color: var(--accent);
    transition: color 0.3s;
  }

  .header-sub {
    font-size: 13px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ==================== START BUTTON (BIG) ==================== */
  .start-btn {
    width: 100%;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 20px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 0.08em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 30%, transparent);
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .start-btn:active {
    transform: translateY(2px);
    box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 30%, transparent);
  }

  .start-btn svg {
    width: 28px;
    height: 28px;
    fill: currentColor;
  }

  .start-btn .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    opacity: 0.7;
    margin-left: 8px;
  }

  /* ==================== PROGRESS ==================== */
  .progress-wrap { margin: 0 0 24px; }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .progress-label .pct { color: var(--yellow); font-weight: 700; }

  .progress-bar {
    height: 4px;
    background: var(--bg-elevated);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--yellow));
    width: 0%;
    transition: width 0.4s ease;
  }

  /* ==================== SECTION ==================== */
  .section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 14px;
    overflow: hidden;
  }

  .section.complete { border-color: var(--accent-dim); }

  .section-head {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elevated);
  }

  .section-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--accent);
    line-height: 1;
    min-width: 28px;
    transition: color 0.3s;
  }

  .section-info { flex: 1; min-width: 0; }

  .section-title {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.02em;
    margin-bottom: 2px;
  }

  .section-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
  }

  .section-meta .rest { color: var(--yellow); }

  /* ==================== SETS ==================== */
  .sets { padding: 8px 4px; }

  .set-row {
    display: flex;
    align-items: center;
    padding: 12px 12px;
    border-radius: 6px;
    gap: 12px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .set-row:active { background: var(--bg-elevated); }
  .set-row.done { opacity: 0.42; }
  .set-row.done .set-weight, .set-row.done .set-reps { text-decoration: line-through; }
  .set-row.done .set-weight.edited,
  .set-row.done .set-reps.edited { text-decoration: none; }
  .set-row.skipped { opacity: 0.42; }

  .checkbox {
    width: 24px;
    height: 24px;
    border: 2px solid var(--text-faint);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    background: var(--bg);
  }

  .set-row.done .checkbox {
    background: var(--accent);
    border-color: var(--accent);
    animation: check-pop 0.25s ease;
  }

  .checkbox svg {
    width: 12px; height: 12px;
    stroke: var(--text);
    stroke-width: 3;
    fill: none;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .set-row.done .checkbox svg { opacity: 1; }

  .set-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    font-weight: 700;
    min-width: 30px;
  }

  .set-content { flex: 1; display: flex; align-items: baseline; gap: 8px; min-width: 0; }

  .set-weight {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--text);
    line-height: 1;
  }

  .set-weight.edited { color: var(--yellow); }

  .set-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .set-divider { width: 1px; height: 14px; background: var(--border); }

  .set-reps {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 700;
  }

  .set-reps .num { color: var(--text); font-size: 16px; }
  .set-reps.edited .num { color: var(--yellow); }

  .set-old {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    text-decoration: line-through;
    align-self: center;
  }

  .set-skip-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-faint);
    letter-spacing: 0.12em;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 5px;
    align-self: center;
  }

  .set-rpe-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--yellow);
    align-self: center;
  }

  .timer-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .timer-btn:active {
    background: var(--yellow);
    color: var(--bg);
    border-color: var(--yellow);
  }

  .timer-btn svg { width: 14px; height: 14px; }

  /* ==================== DAY STRIP ==================== */
  .day-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 18px;
    padding-bottom: 4px;
    scrollbar-width: none;
  }

  .day-strip::-webkit-scrollbar { display: none; }

  .day-chip {
    flex: 1 0 auto;
    min-width: 58px;
    padding: 8px 10px 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .day-chip .d {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    line-height: 1;
    color: var(--text-dim);
  }

  .day-chip .wd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.1em;
    color: var(--text-faint);
  }

  .day-chip.active {
    border-color: var(--chip-color, var(--accent));
    background: var(--bg-elevated);
  }

  .day-chip.active .d { color: var(--chip-color, var(--accent)); }

  .day-chip .day-dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  .day-chip.in-progress .day-dot { background: var(--chip-color, var(--accent)); }
  .day-chip.completed .day-dot { background: var(--green); box-shadow: 0 0 4px var(--green); }

  /* ==================== ACTUAL EDIT SHEET (실측 기록) ==================== */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    z-index: 120;
    display: none;
  }

  .sheet-backdrop.active { display: block; }

  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg-elevated);
    border-top: 2px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 16px 20px calc(20px + env(safe-area-inset-bottom));
    z-index: 121;
    transform: translateY(110%);
    transition: transform 0.22s ease;
    max-width: 560px;
    margin: 0 auto;
  }

  .sheet.active { transform: translateY(0); }

  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    margin: 0 auto 14px;
  }

  .sheet-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-align: center;
    margin-bottom: 16px;
  }

  .stepper-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 6px;
  }

  .stepper-btn {
    width: 60px;
    height: 56px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .stepper-btn:active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  .stepper-val {
    width: 120px;
    background: none;
    border: none;
    color: var(--text);
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 54px;
    line-height: 1;
    padding: 0;
  }

  .stepper-val:focus { outline: none; color: var(--yellow); }
  .stepper-val::-webkit-outer-spin-button,
  .stepper-val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper-val[type=number] { -moz-appearance: textfield; appearance: textfield; }

  .stepper-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.15em;
    margin-bottom: 12px;
  }

  .rpe-row {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 4px 0 18px;
  }

  .rpe-chip {
    padding: 7px 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .rpe-chip.on { border-color: var(--yellow); color: var(--yellow); }

  .sheet-actions { display: flex; gap: 10px; }

  .sheet-btn {
    flex: 1;
    padding: 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.08em;
    -webkit-tap-highlight-color: transparent;
  }

  .sheet-btn.save { background: var(--accent); color: var(--bg); flex: 2; }
  .sheet-btn.skip {
    background: var(--bg-card);
    color: var(--text-dim);
    border: 1px solid var(--border);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
  }

  /* ==================== CALENDAR (기록 탭) ==================== */
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .cal-month {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 0.04em;
  }

  .cal-nav { display: flex; gap: 8px; }

  .cal-nav button {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .cal-nav button:active { background: var(--bg-elevated); }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 14px;
  }

  .cal-wd {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-faint);
    padding: 6px 0;
    letter-spacing: 0.1em;
  }

  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border-radius: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    border: 1px solid transparent;
  }

  .cal-cell.empty { cursor: default; }
  .cal-cell.today { border-color: var(--accent); color: var(--text); }
  .cal-cell.selected { background: var(--bg-elevated); border-color: var(--border); }

  .cal-cell .cal-dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  .cal-cell.has-log .cal-dot { background: var(--log-color, var(--accent)); }
  .cal-cell.has-log.partial .cal-dot { opacity: 0.45; }

  .cal-summary {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card);
    margin-bottom: 14px;
  }

  .cal-day-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .cal-day-card .t { font-weight: 900; margin-bottom: 6px; font-size: 15px; }

  .cal-day-card .m {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 12px;
    letter-spacing: 0.04em;
  }

  .cal-day-card .go {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    -webkit-tap-highlight-color: transparent;
  }

  .empty-state {
    text-align: center;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 36px 0;
    letter-spacing: 0.08em;
    line-height: 2.2;
  }

  /* ==================== LOG DETAIL ==================== */
  .detail-back {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    cursor: pointer;
    margin-bottom: 14px;
    -webkit-tap-highlight-color: transparent;
  }

  .note-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 2px solid var(--yellow);
    border-radius: 8px;
    padding: 14px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 14px;
  }

  /* ==================== SETTINGS ==================== */
  .settings-item {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Noto Sans KR', sans-serif;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }

  .settings-item:active { background: var(--bg-elevated); }

  .settings-item .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }

  /* ==================== ACTION ROW (memo/reset) ==================== */
  .action-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
  }

  /* ==================== TIMER OVERLAY (체크리스트 모드용) ==================== */
  .timer-overlay {
    position: fixed;
    bottom: calc(80px + env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    background: var(--bg-elevated);
    border-top: 2px solid var(--yellow);
    padding: 14px 16px;
    padding-bottom: 14px;
    display: none;
    align-items: center;
    gap: 14px;
    z-index: 50;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
  }

  .timer-overlay.active { display: flex; }

  .timer-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--yellow);
    line-height: 1;
    letter-spacing: 0.02em;
    min-width: 90px;
    font-variant-numeric: tabular-nums;
  }

  .timer-display.warning { color: var(--accent); animation: pulse 0.6s infinite; }

  .timer-info {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }

  .timer-info .label {
    display: block;
    margin-bottom: 4px;
    color: var(--yellow);
    font-weight: 700;
  }

  .timer-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;

  .focus-next-label {

    color: var(--text-dim);

  /* Focus Bottom Buttons */
  .focus-bottom {
    padding: 16px 20px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
  }

  .focus-btn {
    width: 100%;
    padding: 20px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--bg);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.1em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

  .focus-btn:active { transform: translateY(2px); }

  .focus-btn svg { width: 22px; height: 22px; fill: currentColor; }

  .focus-btn.secondary {
    background: var(--bg-elevated);

  .focus-alt-btn {

    background: none;
    border: none;
    color: var(--text-dim);

    font-size: 12px;
    letter-spacing: 0.06em;

    margin-bottom: 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;

  .focus-alt-btn:active { color: var(--yellow); }

  /* Completion Screen */
  .focus-complete {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }

  .complete-icon {
    font-size: 80px;
    margin-bottom: 20px;
  }

  .complete-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    line-height: 1;
    color: var(--green);
    margin-bottom: 12px;
    letter-spacing: 0.05em;
  }

  .complete-sub {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 32px;
    line-height: 1.6;

  /* ==================== FAB (gymbro 챗 진입) ==================== */
  .fab {
    position: fixed;
    right: 16px;
    bottom: calc(96px + env(safe-area-inset-bottom));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
    border: none;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .fab.show { display: flex; }
  .fab:active { transform: scale(0.94); }
  .fab svg { width: 26px; height: 26px; fill: currentColor; }

  /* 휴식 타이머 오버레이가 떠 있으면 FAB 숨김 (겹침 회피) */
  .timer-overlay.active ~ .fab { display: none; }

  /* ==================== CHAT OVERLAY (gymbro) ==================== */
  .chat-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 110;
    display: none;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }

  .chat-overlay.active { display: flex; }

  .chat-header {
    display: flex;
    align-items: center;

    border-bottom: 1px solid var(--border);

  .chat-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 0.06em;
  }

  .chat-title span { color: var(--accent); }

  .chat-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    flex: 1;
    text-align: right;
  }

  .chat-hbtn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.08em;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .chat-hbtn.gen { border-color: var(--green); color: var(--green); }

  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chat-msg {
    max-width: 86%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .chat-msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: var(--bg);
    border-bottom-right-radius: 4px;
  }

  .chat-msg.bot {
    align-self: flex-start;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .chat-msg.sys {
    align-self: center;
    background: none;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-align: center;

  .chat-typing {
    align-self: flex-start;

  .quick-chip {
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-dim);
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;

  .quick-chip:active { border-color: var(--accent); color: var(--text); }

  .chat-input-bar {
    display: flex;
    gap: 8px;

  .chat-input {
    flex: 1;
    background: var(--bg-elevated);

  /* ==================== ANIMATIONS ==================== */
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  @media (max-height: 600px) {

    .focus-rest-timer { font-size: 130px; }
  }
</style>
